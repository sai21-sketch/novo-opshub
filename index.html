<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novo OpsHub</title>
<style>
:root{--bg:#f4f5ff;--card:#fff;--tx:#180748;--mu:#697089;--bd:#e3e6ef;--pr:#3d44e3;--side:#180748;--g:#0f9d6b;--r:#d92d4b;--w:#c98a0b}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
aside{position:fixed;inset:0 auto 0 0;width:230px;background:var(--side);color:#c5cae6;padding:16px 10px;overflow:auto;z-index:20;transition:.2s}
aside h1{font-size:18px;color:#fff;margin:0 8px}aside small{display:block;margin:0 8px 14px;font-size:11px;opacity:.7}
aside a{display:block;padding:8px 12px;border-radius:8px;cursor:pointer;color:inherit}aside a:hover{background:#ffffff1f}aside a.on{background:var(--pr);color:#fff}
header{position:sticky;top:0;z-index:10;margin-left:230px;background:#fffffff2;border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;padding:10px 20px;flex-wrap:wrap}
main{margin-left:230px;padding:20px}
.burger{display:none}
input,select,textarea,button{font:inherit}
input,select,textarea{border:1px solid var(--bd);border-radius:8px;padding:8px 10px;background:#fff;width:100%}
.btn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}.btn:hover{background:#eef0fb}
.pr{background:var(--pr);color:#fff;border-color:var(--pr)}.pr:hover{filter:brightness(.9)}.dg{color:var(--r)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpi{cursor:pointer;transition:.15s}.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 18px #1a1f4d18}.kpi b{font-size:26px;display:block}.kpi span{color:var(--mu);font-size:12px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:#eceef6;color:#48506e;white-space:nowrap}
.b-g{background:#dcf5ea;color:#0b7a54}.b-r{background:#fde1e7;color:#b3163a}.b-w{background:#fbeccb;color:#8a5a00}
.tw{overflow:auto;max-height:65vh}table{border-collapse:collapse;width:100%}th{position:sticky;top:0;background:#eceeff;text-align:left;cursor:pointer;white-space:nowrap}
th,td{padding:9px 12px;border-bottom:1px solid var(--bd)}tr:hover td{background:#fafbff}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}.bar i{display:block;height:12px;border-radius:6px;background:var(--pr);min-width:2px}.bar em{width:110px;font-style:normal;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.mod>div{background:#fff;border-radius:14px;padding:20px;width:560px;max-width:100%;max-height:90vh;overflow:auto}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{font-size:12px;color:var(--mu)}.fg .full{grid-column:1/-1}.err{color:var(--r);font-size:12px}
#toast{position:fixed;bottom:18px;right:18px;background:#180748;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;display:none}
.pop{position:absolute;right:20px;top:58px;background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:0 10px 30px #0002;width:340px;max-height:70vh;overflow:auto;padding:8px;z-index:30}
.pop div{padding:7px 8px;border-bottom:1px solid var(--bd);cursor:pointer}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.row h2{margin:0;flex:1}
.demo{background:#fbeccb;color:#6b4700;padding:6px 12px;border-radius:8px;font-size:12px}
.li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.logo{background:#fff;border-radius:12px;padding:8px 12px;margin:0 6px 8px}.logo img{width:100%;display:block}
#gate{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#180748,#3d44e3);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#gate .card{width:460px;max-width:100%}#gate img{height:46px}#gate pre{max-height:150px;overflow:auto;background:#f4f5ff;padding:8px;border-radius:8px;font-size:11px;white-space:pre-wrap}
.gh{padding:9px 12px;margin-top:6px;border-radius:8px;cursor:pointer;color:#fff;font-weight:600;display:flex;justify-content:space-between}.gh:hover{background:#ffffff1f}.gh span{transition:.2s}.gh.o span{transform:rotate(180deg)}aside a.sub{padding:6px 12px 6px 28px;font-size:13px}
@media(max-width:860px){aside{transform:translateX(-100%)}aside.open{transform:none}header,main{margin-left:0}.burger{display:inline-block}.fg{grid-template-columns:1fr}}
@media print{aside,header,.row .btn,.demo{display:none}header,main{margin:0}}
.kcol{background:#eef0ff;border-radius:12px;padding:10px;min-height:140px}.kcard{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab}
</style></head><body>
<div id="gate" style="display:none"></div><aside id="nav"></aside>
<header><button class="btn burger" onclick="$('#nav').classList.toggle('open')">☰</button>
<input id="gs" placeholder="🔍 Search everything…" style="max-width:280px" oninput="gsearch(this.value)">
<select id="loc" style="width:150px" onchange="LOC=this.value;go(cur)"></select>
<span style="flex:1"></span><span id="dt" style="color:var(--mu)"></span>
<div style="position:relative"><button class="btn pr" onclick="quick()">+ Quick Add</button></div>
<button class="btn" onclick="bell()">🔔 <b id="bc"></b></button><span id="usr"></span></header>
<main id="main"></main><div id="pop"></div><div id="pop2"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== HELPERS ===== */
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'),today=()=>iso(new Date());
const d=n=>{const x=new Date();x.setDate(x.getDate()+n);return iso(x)};
const days=s=>s?Math.round((new Date(s)-new Date(today()))/864e5):null;
const num=v=>parseFloat(v)||0;
let ST={company:'Novo',user:'User',cur:'₹'};
const money=v=>'₹'+num(v).toLocaleString('en-IN',{maximumFractionDigits:0});
const PR='Critical,High,Medium,Low';
/* ===== MODULE DEFINITIONS: fields [key,label,type,required]; type: text,num,date,area,loc,sel:a,b ===== */
const M={
tasks:{t:'Tasks',f:[['title','Task title','text',1],['category','Category','sel:Facilities,Maintenance,Procurement,Finance,Vendor,Compliance,Travel,Events,Onboarding,Safety,Inventory,Administrative'],['location','Location','loc'],['assignee','Assigned to'],['priority','Priority','sel:'+PR],['status','Status','sel:Not Started,In Progress,Waiting,Completed,Cancelled'],['due','Due date','date'],['cost','Estimated cost','num'],['notes','Notes','area']],c:['title','category','location','priority','status','due']},
facilities:{t:'Facilities',f:[['name','Office / Building','text',1],['location','Location','loc'],['floor','Floor'],['capacity','Seating capacity','num'],['occupancy','Occupancy','num'],['utilities','Utilities (internet, HVAC, security…)'],['status','Status','sel:Operational,Attention Required,Under Maintenance,Critical'],['notes','Notes / issues','area']],c:['name','location','capacity','occupancy','status']},
maintenance:{t:'Maintenance',f:[['issue','Issue','text',1],['location','Location','loc'],['asset','Asset'],['category','Category','sel:Electrical,Plumbing,HVAC,Internet,Furniture,Security,Cleaning,Appliances,Building,IT/Office Equipment,Other'],['reported','Reported date','date'],['priority','Priority','sel:'+PR],['vendor','Assigned vendor'],['cost','Estimated cost','num'],['actual','Actual cost','num'],['status','Status','sel:Open,In Progress,Waiting,Completed'],['done','Completion date','date'],['file','Attach file (PDF or image, max 1.5 MB, or 10 MB with Cloudinary)','file'],['notes','Notes','area']],c:['issue','location','category','priority','status','vendor','cost']},
vendors:{t:'Vendors',f:[['name','Company name','text',1],['category','Category','sel:Cleaning,Security,Maintenance,Utilities,Catering,Travel,Events,Office Supplies,Furniture,IT,Transportation,Other'],['contact','Contact person'],['email','Email'],['phone','Phone'],['terms','Payment terms'],['value','Annual value','num'],['status','Status','sel:Active,On Hold,Expired,Blacklisted'],['q','Quality (1-5)','num'],['cost','Cost (1-5)','num'],['resp','Responsiveness (1-5)','num'],['sla','SLA adherence (1-5)','num'],['notes','Notes','area']],c:['name','category','contact','status','value','score'],calc:{score:['Score',r=>((num(r.q)+num(r.cost)+num(r.resp)+num(r.sla))/4).toFixed(1)]}},
contracts:{t:'Contracts',f:[['vendor','Vendor','text',1],['service','Service'],['location','Location','loc'],['start','Start date','date'],['end','End date','date',1],['value','Contract value','num'],['freq','Payment frequency','sel:Monthly,Quarterly,Annual,One-time'],['notice','Notice period (days)','num'],['status','Status','sel:Active,Pending Renewal,Expired,Terminated'],['file','Attach file (PDF or image, max 1.5 MB, or 10 MB with Cloudinary)','file'],['notes','Renewal terms / notes','area']],c:['vendor','service','end','value','status','left','file'],calc:{left:['Days left',r=>{const n=days(r.end);return n===null?'':n<0?'Expired':n+' d'}]}},
expenses:{t:'Budget & Expenses',f:[['date','Date','date',1],['location','Location','loc'],['category','Category','sel:Rent,Electricity,Internet,Cleaning,Security,Maintenance,Office Supplies,Furniture,Travel,Events,Employee Engagement,Pantry,Transportation,Other'],['vendor','Vendor'],['description','Description','text',1],['budget','Budget','num'],['amount','Amount','num',1],['status','Payment status','sel:Pending,Paid'],['approved','Approved by'],['file','Attach file (PDF or image, max 1.5 MB, or 10 MB with Cloudinary)','file'],['notes','Notes','area']],c:['date','category','description','location','budget','amount','var','status','file'],calc:{var:['Variance',r=>money(num(r.budget)-num(r.amount))]}},
invoices:{t:'Purchases',f:[['number','Invoice number','text',1],['vendor','Vendor'],['location','Location','loc'],['date','Invoice date','date'],['due','Due date','date',1],['category','Category','sel:Rent,Electricity,Internet,Cleaning,Security,Maintenance,Office Supplies,Furniture,Travel,Events,Pantry,Transportation'],['amount','Amount','num',1],['tax','Tax','num'],['status','Status','sel:Received,Under Review,Submitted,Approved,Paid,Rejected,On Hold'],['paid','Paid date','date'],['file','Invoice file (PDF or image, max 1.5 MB, or 10 MB with Cloudinary)','file'],['notes','Notes','area']],c:['number','vendor','due','total','status','age','file'],calc:{total:['Total',r=>money(num(r.amount)+num(r.tax))],age:['Aging',r=>r.status==='Paid'?'':(days(r.due)<0?-days(r.due)+' d overdue':'due in '+days(r.due)+' d')]}},
inventory:{t:'Inventory & Supplies',f:[['item','Item','text',1],['sku','SKU'],['category','Category','sel:Printer Paper,Pens & Stationery,Printer Cartridges,Pantry Supplies,Cleaning Supplies,Welcome Kits'],['location','Location','loc'],['stock','Current stock','num'],['min','Minimum stock','num'],['max','Maximum stock','num'],['unit','Unit'],['ucost','Unit cost','num'],['supplier','Supplier'],['notes','Notes','area']],c:['item','location','stock','min','stock_status','value'],calc:{stock_status:['Stock',r=>stockSt(r)],value:['Value',r=>money(num(r.stock)*num(r.ucost))]}},
assets:{t:'Assets',f:[['desc','Description','text',1],['type','Type','sel:Furniture,Laptop,Monitor,Printer,Phone,Networking equipment,Appliances,Security equipment,Other'],['serial','Serial number'],['location','Location','loc'],['employee','Assigned employee'],['bought','Purchase date','date'],['price','Purchase price','num'],['warranty','Warranty expiry','date'],['status','Status','sel:Active,In Repair,Available,Assigned,Retired,Lost'],['file','Attach file (PDF or image, max 1.5 MB, or 10 MB with Cloudinary)','file'],['notes','Notes','area']],c:['desc','type','location','employee','warranty','status']},

travel:{t:'Travel',f:[['traveler','Traveler','text',1],['dept','Department'],['dest','Destination'],['purpose','Purpose'],['from','Start date','date'],['to','End date','date'],['cost','Estimated cost','num'],['actual','Actual cost','num'],['approval','Approval','sel:Pending,Approved,Rejected'],['status','Booking status','sel:Planned,Booked,Completed,Cancelled'],['file','Attach file (PDF or image, max 1.5 MB, or 10 MB with Cloudinary)','file'],['notes','Notes','area']],c:['traveler','dest','from','cost','approval','status']},
events:{t:'Events',f:[['name','Event name','text',1],['type','Type','sel:Celebration,Team Event,Offsite,Meeting,Workshop,Company Event'],['date','Date','date'],['location','Location','loc'],['attendees','Expected attendees','num'],['budget','Budget','num'],['actual','Actual cost','num'],['vendor','Vendor'],['owner','Owner'],['status','Status','sel:Planned,Confirmed,Completed,Cancelled'],['file','Attach file (PDF or image, max 1.5 MB, or 10 MB with Cloudinary)','file'],['notes','Notes','area']],c:['name','type','date','budget','actual','status']},

risks:{t:'Risks & Issues',f:[['desc','Risk description','text',1],['category','Category','sel:Facilities,Vendor,Financial,Safety,Compliance,Operational'],['location','Location','loc'],['prob','Probability (1-5)','num'],['impact','Impact (1-5)','num'],['owner','Owner'],['mitigation','Mitigation','area'],['target','Target date','date'],['status','Status','sel:Open,Mitigating,Closed']],c:['desc','location','score','level','status'],calc:{score:['Score',r=>num(r.prob)*num(r.impact)],level:['Level',r=>{const s=num(r.prob)*num(r.impact);return s>=15?'Critical':s>=9?'High':s>=4?'Medium':'Low'}]}},
improvements:{t:'Process Improvement',f:[['problem','Problem','text',1],['root','Root cause'],['solution','Proposed solution'],['savings','Estimated savings','num'],['owner','Owner'],['priority','Priority','sel:'+PR],['category','Category','sel:Cost Reduction,Time Saving,Automation,Vendor Optimization,Process Standardization,Risk Reduction,Employee Experience'],['status','Status','sel:Idea,Approved,In Progress,Done'],['result','Result','area']],c:['problem','category','savings','priority','status']},
locations:{t:'Locations',f:[['name','Location name','text',1],['address','Address'],['manager','Office manager'],['employees','Employees','num'],['capacity','Capacity','num'],['budget','Monthly budget','num']],c:['name','address','manager','employees','capacity','budget']},
requests:{t:'Purchase Requests',f:[['item','Item','text',1],['qty','Quantity','num'],['unit','Unit'],['location','Location','loc'],['supplier','Supplier'],['cost','Estimated cost','num'],['date','Request date','date'],['requester','Requested by'],['status','Status','sel:Requested,Approved,Ordered,Received,Rejected'],['notes','Notes','area']],c:['item','qty','location','supplier','cost','status','date']}
};

function log(action,mod,rec){ACT.unshift({ts:new Date().toLocaleString(),user:ST.user,action,mod,rec});if(!sb)LS();if(sb&&USER)sb.from('activity').insert({usr:USER.email,action,module:mod,rec:String(rec||'')}).then(()=>{})}
async function up(k,recs){if(!sb){LS();return true}const x=recs.map(r=>({id:r.id,module:k,data:r,updated_by:USER.email}));for(let i=0;i<x.length;i+=400){const {error}=await sb.from('records').upsert(x.slice(i,i+400));if(error){toast('Save failed: '+error.message);return false}}return true}
async function rm(ids){if(!sb){Object.keys(M).forEach(k=>db[k]=db[k].filter(x=>!ids.includes(x.id)));LS();return true}const {error}=await sb.from('records').delete().in('id',ids);if(error){toast('Delete failed: '+error.message);return false}return true}
async function loadRemote(){if(!sb){const j=JSON.parse(localStorage.oh_db||'null');if(!j){Object.keys(M).forEach(k=>db[k]=[]);ACT=[];LS();return}Object.keys(M).forEach(k=>db[k]=j.db[k]||[]);ACT=j.ACT||[];if(j.ST)Object.assign(ST,j.ST);return}Object.keys(M).forEach(k=>db[k]=[]);for(let f=0;;f+=1000){const {data,error}=await sb.from('records').select('id,module,data').order('created_at').range(f,f+999);if(error){toast('Load failed: '+error.message);break}data.forEach(r=>{if(r.module==='_settings')Object.assign(ST,r.data);else if(db[r.module])db[r.module].push({...r.data,id:r.id})});if(data.length<1000)break}
const a=await sb.from('activity').select('*').order('ts',{ascending:false}).limit(150);ACT=(a.data||[]).map(x=>({ts:new Date(x.ts).toLocaleString(),user:x.usr,action:x.action,mod:x.module,rec:x.rec}))}
function gate(h){const g=$('#gate');g.style.display='flex';g.innerHTML='<div class="card"><img src="'+LOGO+'"><h2>Novo OpsHub</h2>'+h+'</div>'}
function loginScreen(){gate(`<p style="color:var(--mu)">Sign in to your workspace</p><label>Username</label><input id="em" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')auth()"><p class="err" id="ge"></p><button class="btn pr" onclick="auth()">Sign in</button>`)}
function localLoginScreen(){gate(`<p style="color:var(--mu)">Sign in to your workspace</p><label>Username</label><input id="em" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')localAuth()"><p class="err" id="ge"></p><button class="btn pr" onclick="localAuth()">Sign in</button>`)}
function localAuth(){if($('#em').value.trim().toLowerCase()==='novo'&&$('#pw').value==='novo2026'){sessionStorage.oh_auth='1';start(null)}else $('#ge').textContent='Incorrect username or password.'}
function signOut(){sessionStorage.removeItem('oh_auth');if(sb)sb.auth.signOut().then(()=>location.reload());else location.reload()}
async function auth(){const u=$('#em').value.trim().toLowerCase(),pw=$('#pw').value,em=u.includes('@')?u:u+'@novo-opshub.com';$('#ge').textContent='';let r=await sb.auth.signInWithPassword({email:em,password:pw});
if(r.error&&u==='novo'&&pw==='novo2026'){const c=await sb.auth.signUp({email:em,password:pw});r=(c.data&&c.data.session)?c:await sb.auth.signInWithPassword({email:em,password:pw})}
if(r.error||!r.data.session){$('#ge').textContent='Incorrect username or password.';return}start(r.data.session.user)}
async function start(u){USER=u||{email:'local@novo'};ST.user=u?u.email.split('@')[0]:'novo';await loadRemote();$('#gate').style.display='none';go('dashboard');
setInterval(()=>{if(!sb)return;if(document.querySelector('.mod')||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||cur==='settings')return;loadRemote().then(()=>go(cur))},30000)}
async function boot(){const url=CFG.url,key=CFG.key;if(!url||!key){if(sessionStorage.oh_auth)start(null);else localLoginScreen();return}if(!window.supabase){gate('<p class="err">Could not load the database library. Check your internet connection.</p>');return}sb=supabase.createClient(url,key);const {data}=await sb.auth.getSession();data.session?start(data.session.user):loginScreen()}

function viewRec(k,id){const m=M[k],r=db[k].find(x=>x.id===id);if(!r)return;const lb=l=>e(l.replace(/ \(.*\)/,''));
const body=m.f.map(([n,l])=>`<div class="li"><span style="color:var(--mu)">${lb(l)}</span><span style="text-align:right;max-width:60%;white-space:pre-wrap">${cell(k,n,r)||'—'}</span></div>`).join('')+Object.keys(m.calc||{}).map(c=>`<div class="li"><span style="color:var(--mu)">${m.calc[c][0]}</span><span>${cell(k,c,r)||'—'}</span></div>`).join('');

async function viewFile(k,id){const r=db[k].find(x=>x.id===id);if(!r||!r.file){toast('No file attached.');return}
let u=r.file,type='';if(r.file.startsWith('data:')){const b=await (await fetch(r.file)).blob();u=URL.createObjectURL(b);type=b.type;window._vu=u}else{const ext=((r.fileName||r.file).split('.').pop()||'').toLowerCase().split('?')[0];type=ext==='pdf'?'application/pdf':/^(png|jpe?g|gif|webp|svg)$/.test(ext)?'image/'+ext:''}
const body=type.startsWith('image/')?`<img src="${u}" style="max-width:100%;max-height:75vh;display:block;margin:auto">`:type==='application/pdf'?`<iframe src="${u}" style="width:100%;height:75vh;border:0"></iframe>`:'<p>This file type cannot be previewed. Please attach a PDF or image.</p>';
$('#pop2').innerHTML=`<div class="mod" style="z-index:60"><div style="width:900px"><div class="row"><h3 style="margin:0;flex:1">📄 ${e(r.fileName||'File')}</h3><button class="btn" onclick="closeView()">Close</button></div>${body}</div></div>`}
function closeView(){$('#pop2').innerHTML='';if(window._vu)URL.revokeObjectURL(window._vu)}

const isCat=n=>n==='category'||n==='type',isEd=n=>['category','type','status','priority'].includes(n);

function colChart(labels,series,fmt=v=>v){const W=520,H=210,pl=44,pb=28,pt=14,n=Math.max(labels.length,1),mx=Math.max(1,...series.flatMap(z=>z.v)),iw=(W-pl-8)/n,bw=Math.min(28,iw/(series.length+1));let g='';

labels.forEach((l,i)=>{const x0=pl+i*iw+(iw-bw*series.length)/2;series.forEach((z,j)=>{const h=(H-pt-pb)*z.v[i]/mx;g+=`<rect x="${x0+j*bw}" y="${H-pb-h}" width="${bw-2}" height="${Math.max(h,0)}" rx="3" style="fill:${PAL[j]}"><title>${e(l)} · ${e(z.n)}: ${fmt(z.v[i])}</title></rect>`});g+=`<text x="${pl+i*iw+iw/2}" y="${H-10}" text-anchor="middle" font-size="10" fill="#697089">${e(l.length>9?l.slice(0,8)+'…':l)}</text>`});
return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg><div style="font-size:12px">${series.map((z,j)=>`<span style="margin-right:12px"><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${PAL[j]}"></i> ${z.n}</span>`).join('')}</div>`}

function charts(T){const M6=lastMonths(6),ex=rows('expenses'),inv=rows('invoices'),mt=rows('maintenance'),sumF=(a,f)=>a.reduce((z,x)=>z+num(x[f]),0);

/* ===== FORM MODAL (add / edit with validation) ===== */
function openForm(k,id){const m=M[k],r=id?db[k].find(x=>x.id===id):{};
const inp=([n,l,t,req])=>{const v=e(r[n]??'');const c=t==='area'?`<textarea name="${n}" rows="3">${v}</textarea>`:t&&t.startsWith('sel')?selHtml(k,n,t,r[n]):t==='file'?`<input name="${n}" type="file" accept=".pdf,image/*">${r[n+'Name']?'<small>Current: '+e(r[n+'Name'])+'</small>':''}`:t==='loc'?`<select name="${n}"><option value="">—</option>${db.locations.map(o=>`<option ${r[n]===o.name?'selected':''}>${e(o.name)}</option>`).join('')}</select>`:`<input name="${n}" type="${t==='num'?'number':t==='date'?'date':'text'}" step="any" value="${v}">`;
return `<div class="${t==='area'?'full':''}"><label>${l}${req?' *':''}</label>${c}<div class="err" id="er_${n}"></div></div>`};
$('#pop').innerHTML=`<div class="mod"><div><h3>${id?'Edit':'New'} ${m.t.replace(/s$/,'')}</h3><form id="fm" onsubmit="return false"><div class="fg">${m.f.map(inp).join('')}</div></form><p style="text-align:right"><button class="btn" onclick="$('#pop').innerHTML=''">Cancel</button> <button class="btn pr" onclick="saveRec('${k}','${id||''}')">Save</button></p></div></div>`}
async function saveRec(k,id){const m=M[k],fd=new FormData($('#fm'));let good=true,o={};
m.f.forEach(([n,l,t,req])=>{if(t==='file')return;let v=(fd.get(n)||'').trim();$('#er_'+n).textContent='';if(isCat(n)&&v==='Other'){const ot=(fd.get(n+'__other')||'').trim();if(ot)v=ot;else{$('#er_'+n).textContent='Please write the category';good=false}}if(req&&!v){$('#er_'+n).textContent='Required';good=false}o[n]=t==='num'&&v!==''?parseFloat(v):v});
if(!good)return;for(const f of m.f.filter(f=>f[2]==='file')){const fl=fd.get(f[0]);if(fl&&fl.size){const cl=CFG.cloud&&CFG.preset;if(fl.size>(cl?10485760:1572864)){toast('File too large (max '+(cl?'10':'1.5')+' MB).');return}try{o[f[0]]=await uploadFile(fl)}catch(x){toast('Upload failed: '+x.message);return}o[f[0]+'Name']=fl.name}}let rec;if(id){rec=db[k].find(x=>x.id===id);Object.assign(rec,o)}else{rec={id:uid(),...o};db[k].push(rec)}
if(!await up(k,[rec]))return;log(id?'Updated':'Created',m.t,o[m.f[0][0]]);if(k==='tasks'&&o.status==='Completed')log('Task completed','Tasks',o.title);
$('#pop').innerHTML='';toast(m.t.replace(/s$/,'')+' saved successfully.');go(cur)}
async function delRec(k,id){if(!confirm('Delete this record? This cannot be undone.'))return;const r=db[k].find(x=>x.id===id);if(!await rm([id]))return;db[k]=db[k].filter(x=>x.id!==id);log('Deleted',M[k].t,r[M[k].f[0][0]]);toast('Record deleted.');go(cur)}
function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
function quick(){$('#pop').innerHTML=`<div class="pop">${Object.keys(M).map(k=>`<div onclick="openForm('${k}')">+ New ${M[k].t.replace(/s$/,'')}</div>`).join('')}</div>`}
/* ===== ALERTS / NOTIFICATIONS ===== */
function alerts(){const A=[],P=(p,m,g)=>A.push({p,m,g});
rows('tasks').filter(t=>!['Completed','Cancelled'].includes(t.status)&&days(t.due)<0).forEach(t=>P('High',`Task “${t.title}” is overdue.`,'tasks'));
rows('maintenance').filter(x=>x.status!=='Completed'&&x.priority==='Critical').forEach(x=>P('Critical',`Critical maintenance: ${x.issue}`,'maintenance'));
rows('contracts').filter(c=>c.status!=='Expired'&&days(c.end)!==null&&days(c.end)<=90).forEach(c=>P(days(c.end)<=30?'High':'Medium',days(c.end)<0?`Contract with ${c.vendor} has expired.`:`Contract with ${c.vendor} expires in ${days(c.end)} days.`,'contracts'));
rows('invoices').filter(i=>!['Paid','Rejected'].includes(i.status)&&days(i.due)<0).forEach(i=>P('High',`${money(num(i.amount)+num(i.tax))} invoice ${i.number} is overdue.`,'invoices'));
rows('compliance').filter(c=>c.status!=='Completed'&&days(c.due)<=30).forEach(c=>P(days(c.due)<0?'Critical':'Medium',`Compliance “${c.item}” ${days(c.due)<0?'is overdue':'is due in '+days(c.due)+' days'}.`,'compliance'));
rows('inventory').filter(i=>['Low stock','Out of stock'].includes(stockSt(i))).forEach(i=>P('Medium',`${i.item} (${i.location||'—'}) is ${stockSt(i).toLowerCase()}.`,'inventory'));
rows('travel').filter(t=>days(t.from)>=0&&days(t.from)<=14).forEach(t=>P('Low',`Upcoming travel: ${t.traveler} to ${t.dest} in ${days(t.from)} days.`,'travel'));
rows('events').filter(t=>days(t.date)>=0&&days(t.date)<=30).forEach(t=>P('Low',`Upcoming event: ${t.name} in ${days(t.date)} days.`,'events'));
const bu=budgetTot();if(bu.b&&bu.a>bu.b)P('High','Spending is over budget.','expenses');
return A.sort((a,b)=>'Critical,High,Medium,Low'.indexOf(a.p)-'Critical,High,Medium,Low'.indexOf(b.p))}
function bell(){const a=alerts();$('#pop').innerHTML=`<div class="pop">${a.map(x=>`<div onclick="go('${x.g}')">${badge(x.p)} ${e(x.m)}</div>`).join('')||'<div>No notifications 🎉</div>'}</div>`}
function gsearch(q){if(q.length<2){$('#pop').innerHTML='';return}q=q.toLowerCase();let h='';
Object.keys(M).forEach(k=>db[k].filter(r=>JSON.stringify(r).toLowerCase().includes(q)).slice(0,4).forEach(r=>h+=`<div onclick="viewRec('${k}','${r.id}')"><b>${M[k].t}</b> · ${e(r[M[k].f[0][0]])}</div>`));
$('#pop').innerHTML=`<div class="pop">${h||'<div>No matches</div>'}</div>`}
/* ===== DASHBOARD ===== */
function budgetTot(){const r=rows('expenses');return{b:r.reduce((s,x)=>s+num(x.budget),0),a:r.reduce((s,x)=>s+num(x.amount),0)}}
function bars(obj,fmt=v=>v){const mx=Math.max(1,...Object.values(obj));return Object.entries(obj).map(([k,v])=>`<div class="bar"><em title="${e(k)}">${e(k)}</em><i style="width:${v/mx*60}%"></i>${fmt(v)}</div>`).join('')||'<p style="color:var(--mu)">No data yet</p>'}
const grp=(arr,f,v=()=>1)=>arr.reduce((o,x)=>{const k=x[f]||'—';o[k]=(o[k]||0)+v(x);return o},{});
function dashboard(){const T=rows('tasks'),mo=today().slice(0,7),bu=budgetTot();
const K=[['Open Tasks',T.filter(t=>!['Completed','Cancelled'].includes(t.status)).length,'tasks'],['Pending Maintenance',rows('maintenance').filter(x=>x.status!=='Completed').length,'maintenance'],['Monthly Expenses',money(rows('expenses').filter(x=>(x.date||'').startsWith(mo)).reduce((s,x)=>s+num(x.amount),0)),'expenses'],['Budget Utilization',bu.b?Math.round(bu.a/bu.b*100)+'%':'—','expenses'],['Pending Purchases',rows('invoices').filter(i=>!['Paid','Rejected'].includes(i.status)).length,'invoices'],['Active Vendors',db.vendors.filter(v=>v.status==='Active').length,'vendors'],['Contracts Expiring (90d)',rows('contracts').filter(c=>days(c.end)>=0&&days(c.end)<=90).length,'contracts'],['Compliance Due (30d)',rows('compliance').filter(c=>c.status!=='Completed'&&days(c.due)<=30).length,'compliance'],['Upcoming Events',rows('events').filter(x=>days(x.date)>=0).length,'events'],['Open Risks',rows('risks').filter(x=>x.status!=='Closed').length,'risks']];
const a=alerts();
$('#main').innerHTML=`<div class="demo">${sb?'Shared team workspace · changes are saved to your company database and visible to everyone signed in':'Local mode · data is saved in this browser only (connect the database to share with your team)'} · Confidential.</div><br>
<div class="grid kpis">${K.map(([l,v,g])=>`<div class="card kpi" onclick="go('${g}')"><b>${v}</b><span>${l}</span></div>`).join('')}</div><br>
${charts(T)}
<div class="grid two"><div class="card"><h3>Priority Action Center</h3>${a.slice(0,10).map(x=>`<div class="li" style="cursor:pointer" onclick="go('${x.g}')"><span>${e(x.m)}</span>${badge(x.p)}</div>`).join('')||'Nothing urgent 🎉'}</div>
<div class="card"><h3>Recent activity</h3>${ACT.slice(0,8).map(x=>`<div class="li"><span>${e(x.action)} · ${e(x.mod)}: ${e(x.rec)}</span><small>${e(x.ts)}</small></div>`).join('')||'No activity yet'}</div></div><br><h3>All modules — preview & quick add</h3><div class="grid two">${Object.keys(M).map(glance).join('')}</div>`}
const glance=k=>{const m=M[k],r=rows(k);return `<div class="card"><div class="row" style="margin:0 0 6px"><h3 style="margin:0;flex:1">${m.t} <span class="badge">${r.length}</span></h3><button class="btn" onclick="go('${k}')">View all</button><button class="btn pr" onclick="openForm('${k}')">+ Add</button></div>${r.slice(-3).reverse().map(x=>`<div class="li"><span>${e(x[m.f[0][0]])}</span><span>${badge(x.status||x.priority||'')} <button class="btn" title="View details" onclick="viewRec('${k}','${x.id}')">👁</button></span></div>`).join('')||'<p style="color:var(--mu);margin:6px 0">No records yet</p>'}</div>`}
/* ===== REPORTS / CSV ===== */
function csv(k,rowsIn){const m=M[k],r=rowsIn||db[k];const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
const t=[m.f.map(f=>q(f[1])).join(',')].concat(r.map(x=>m.f.map(f=>q(x[f[0]])).join(','))).join('\n');
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=k+'.csv';a.click();toast('CSV exported.')}
function reports(){const T=rows('tasks'),sum=(k,f)=>rows(k).reduce((s,x)=>s+num(x[f]),0),bu=budgetTot(),cp=rows('compliance');
const L=[['Total tasks',T.length],['Completed tasks',T.filter(t=>t.status==='Completed').length],['Open maintenance issues',rows('maintenance').filter(x=>x.status!=='Completed').length],['Maintenance spend',money(sum('maintenance','actual'))],['Invoice total (incl. tax)',money(sum('invoices','amount')+sum('invoices','tax'))],['Unpaid invoices',money(rows('invoices').filter(i=>i.status!=='Paid').reduce((s,i)=>s+num(i.amount)+num(i.tax),0))],['Travel spend (est.)',money(sum('travel','cost'))],['Event spend (actual)',money(sum('events','actual'))],['Inventory value',money(rows('inventory').reduce((s,i)=>s+num(i.stock)*num(i.ucost),0))],['Total budget',money(bu.b)],['Actual spending',money(bu.a)],['Variance (Budget − Actual)',money(bu.b-bu.a)],['Budget utilization',bu.b?(bu.a/bu.b*100).toFixed(1)+'%':'—'],['Compliance completion',cp.length?Math.round(cp.filter(c=>c.status==='Completed').length/cp.length*100)+'%':'—']];
$('#main').innerHTML=`<div class="row"><h2>Reports</h2><button class="btn" onclick="window.print()">🖨 Print</button><button class="btn" onclick="repCsv()">⬇ Export CSV</button><button class="btn pr" onclick="$('#sm').style.display='block'">Generate Summary</button></div>
<div class="card"><h3>Monthly Operations Report</h3>${L.map(([a,b])=>`<div class="li"><span>${a}</span><b>${b}</b></div>`).join('')}<div id="sm" style="display:none;margin-top:12px;background:#f0f2f9;padding:12px;border-radius:10px">${e(ST.company)} operations summary: ${L[1][1]} of ${L[0][1]} tasks completed, ${L[2][1]} open maintenance issues, budget utilization ${L[12][1]}, ${alerts().length} active alerts.</div></div><br>
<div class="grid two"><div class="card"><h3>Vendor report</h3>${db.vendors.map(v=>`<div class="li"><span>${e(v.name)}</span><span>Score ${M.vendors.calc.score[1](v)} · ${money(v.value)}</span></div>`).join('')||'—'}</div>
<div class="card"><h3>Facilities report</h3>${bars(grp(rows('maintenance'),'category'))}<small>Maintenance incidents by category (repeats show recurring issues)</small></div></div><br>
<div class="card"><h3>Risk matrix (probability × impact)</h3><table style="text-align:center"><tr><th></th>${[1,2,3,4,5].map(i=>`<th>I${i}</th>`).join('')}</tr>${[5,4,3,2,1].map(p=>`<tr><th>P${p}</th>${[1,2,3,4,5].map(i=>{const n=rows('risks').filter(r=>num(r.prob)===p&&num(r.impact)===i).length,s=p*i;return`<td style="background:${s>=15?'#fde1e7':s>=9?'#fbeccb':s>=4?'#eef4d8':'#dcf5ea'}">${n||''}</td>`}).join('')}</tr>`).join('')}</table></div>`}
function repCsv(){const t='Metric,Value\n'+[...document.querySelectorAll('#main .card:first-of-type .li')].map(x=>x.innerText.replace('\n',',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='monthly-report.csv';a.click()}
function logPage(){$('#main').innerHTML=`<div class="row"><h2>Activity Log</h2></div><div class="card"><div class="tw"><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Module</th><th>Record</th></tr></thead><tbody>${ACT.map(x=>`<tr><td>${e(x.ts)}</td><td>${e(x.user)}</td><td>${e(x.action)}</td><td>${e(x.mod)}</td><td>${e(x.rec)}</td></tr>`).join('')||'<tr><td colspan=5>No activity yet</td></tr>'}</tbody></table></div></div>`}
/* ===== SETTINGS / DATA ===== */
function settings(){$('#main').innerHTML=`<div class="row"><h2>Settings</h2></div><div class="grid two"><div class="card"><h3>General</h3><label>Company name</label><input id="s1" value="${e(ST.company)}"><p>Signed in as <b>${e(ST.user)}</b><br>Currency: Indian Rupee (₹)</p><p><button class="btn pr" onclick="saveGen()">Save</button></p></div>
<div class="card"><h3>Data management</h3><p style="color:var(--mu)">${sb?'Data is shared by everyone signed in.':'Local mode: data is saved in this browser only.'} Export a backup regularly.</p><p><button class="btn pr" onclick="exportAll()">⬇ Export all data (JSON)</button></p><p><label class="btn" style="display:inline-block">⬆ Import data<input type="file" accept=".json" hidden onchange="importAll(this.files[0])"></label></p><p><button class="btn dg" onclick="clearAll()">Clear all data</button></p></div>${catCard()}</div>`}
async function saveGen(){ST.company=$('#s1').value;toast(await persistSt()?'Settings saved.':'Could not save.')}
function exportAll(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({db,ACT})],{type:'application/json'}));a.download='novo-opshub-backup.json';a.click()}
function importAll(f){const r=new FileReader();r.onload=async()=>{try{const j=JSON.parse(r.result);for(const k of Object.keys(M)){const a=(j.db[k]||[]).map(x=>({...x,id:x.id||uid()}));const ids=new Set(a.map(x=>x.id));db[k]=db[k].filter(x=>!ids.has(x.id)).concat(a);if(a.length)await up(k,a)}toast('Data imported.');go('dashboard')}catch(x){toast('Invalid file.')}};r.readAsText(f)}
async function clearAll(){if(!confirm('Delete ALL records for everyone? This cannot be undone.'))return;if(sb){const {error}=await sb.from('records').delete().neq('module','_settings');if(error)return toast(error.message)}Object.keys(M).forEach(k=>db[k]=[]);log('Cleared all data','System','');toast('All data cleared.');go('settings')}
function help(){$('#main').innerHTML=`<div class="row"><h2>How to use Novo OpsHub</h2></div><div class="card"><p><b>Start:</b> Add your Locations first (Facilities & Assets → Locations), then enter your records.</p><p><b>Every module</b> works the same way: “+ Add” creates a record, “Edit” / “✕” change or delete it, the search box and status filter narrow the list, column titles sort. Quick Add (top right) and the “All modules” section on the Dashboard let you preview and add records for any module.</p><p><b>Dashboard</b> live numbers; <b>Tasks / Maintenance</b> to-dos and repairs; <b>Vendors / Contracts</b> suppliers and expiry dates; <b>Finance</b> = Budget & Expenses, Purchases (invoices with file upload) and All Transactions (everything in one list, in ₹); <b>Inventory / Assets</b> supplies and equipment; <b>Compliance / Checklists</b> deadlines and inspections; <b>Travel / Events / Onboarding</b> logistics; <b>Documents</b> store files you can view with the 👁 button (PDF or image); <b>Risks</b> score = probability × impact; <b>Reports</b> summary, CSV, print.</p><p><b>New:</b> Tasks have a List / Board view (drag cards between columns). Low-stock inventory rows have a 🛒 Request button that creates a Purchase Request (Finance). Settings lets you edit categories, statuses and priorities. The 👁 details window shows related records.</p><p><b>Teammates:</b> everyone opens the same hosted link and signs in with their own email. Changes appear for others within ~30 seconds.</p></div>`}
boot();
</script></body></html>
